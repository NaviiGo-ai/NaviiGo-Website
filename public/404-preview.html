<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Page Not Found | NaviiGo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #070c16;
      color: #e2e8f0;
      height: 100%;
      overflow: hidden;
    }

    /* ─── Stars Canvas ─── */
    #star-canvas {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Ambient Glows ─── */
    .glow-blue {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,102,204,0.13) 0%, transparent 70%);
      top: -260px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .glow-orange {
      position: fixed;
      width: 460px;
      height: 460px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(249,115,22,0.07) 0%, transparent 70%);
      bottom: -80px;
      left: 35%;
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Page Shell ─── */
    .page {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ─── Navbar ─── */
    .navbar {
      padding: 0 1.75rem;
      height: 68px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.625rem;
      text-decoration: none;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #0066CC, #10b981);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 0.9rem;
      color: white;
    }

    .logo-text {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
      letter-spacing: -0.025em;
    }

    /* ─── Hero — takes up all remaining space ─── */
    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 1.5rem 2rem;
      gap: 0;
    }

    /* ─── 404 Number ─── */
    .code-404 {
      font-size: clamp(7rem, 22vw, 13rem);
      font-weight: 900;
      letter-spacing: -0.05em;
      line-height: 1;
      background: linear-gradient(135deg, #1e40af 0%, #0066CC 35%, #7c3aed 65%, #db2777 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: fadeUp 0.7s cubic-bezier(0.22,0.61,0.36,1) both;
      margin-bottom: 1.5rem;
    }

    /* ─── Spinning Compass ─── */
    .compass-wrap {
      margin-bottom: 1.5rem;
      animation: fadeUp 0.7s 0.08s cubic-bezier(0.22,0.61,0.36,1) both;
    }

    .compass-ring {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,102,204,0.3);
      background: rgba(0,102,204,0.06);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .compass-ring::after {
      content: '';
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      border: 1px dashed rgba(0,102,204,0.1);
      animation: spin 18s linear infinite;
    }

    .compass-svg {
      width: 28px;
      height: 28px;
      color: #3b82f6;
      animation: spin 8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── Eyebrow ─── */
    .eyebrow {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #3b82f6;
      margin-bottom: 0.75rem;
      animation: fadeUp 0.7s 0.14s cubic-bezier(0.22,0.61,0.36,1) both;
    }

    /* ─── Heading ─── */
    .heading {
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #f1f5f9;
      margin-bottom: 0.75rem;
      animation: fadeUp 0.7s 0.2s cubic-bezier(0.22,0.61,0.36,1) both;
      max-width: 540px;
    }

    .heading em {
      font-style: italic;
      font-family: Georgia, 'Times New Roman', serif;
      background: linear-gradient(to right, #f97316, #e11d48);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── Subtext ─── */
    .subtext {
      font-size: 0.9375rem;
      color: #64748b;
      max-width: 380px;
      line-height: 1.65;
      margin-bottom: 2rem;
      animation: fadeUp 0.7s 0.26s cubic-bezier(0.22,0.61,0.36,1) both;
    }

    /* ─── CTA Button ─── */
    .btn-home {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 2rem;
      border-radius: 0.875rem;
      font-weight: 700;
      font-size: 0.875rem;
      text-decoration: none;
      background: #0066CC;
      color: #fff;
      border: none;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 8px 28px rgba(0,102,204,0.28), 0 0 0 1px rgba(0,102,204,0.4) inset;
      transition: all 0.22s cubic-bezier(0.22,0.61,0.36,1);
      animation: fadeUp 0.7s 0.32s cubic-bezier(0.22,0.61,0.36,1) both;
    }

    .btn-home:hover {
      background: #0077ee;
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(0,102,204,0.38);
    }

    .btn-home:active {
      transform: translateY(0);
    }

    /* ─── Keyframes ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── Mobile: shrink compass on tiny screens ─── */
    @media (max-height: 680px) {
      .compass-wrap { display: none; }
      .code-404 { margin-bottom: 1rem; }
    }
  </style>
</head>
<body>

<div class="glow-blue"></div>
<div class="glow-orange"></div>
<canvas id="star-canvas"></canvas>

<div class="page">

  <nav class="navbar">
    <a href="/" class="logo">
      <div class="logo-icon">N</div>
      <span class="logo-text">NaviiGo</span>
    </a>
  </nav>

  <main class="hero">

    <div class="code-404">404</div>

    <div class="compass-wrap">
      <div class="compass-ring">
        <svg class="compass-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76" fill="currentColor" opacity="0.55"/>
        </svg>
      </div>
    </div>

    <p class="eyebrow">Lost on the Map</p>

    <h1 class="heading">This trail leads <em>nowhere.</em></h1>

    <p class="subtext">
      The page you're looking for doesn't exist or has been moved.
    </p>

    <a href="/" class="btn-home">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Back to Home
    </a>

  </main>

</div>

<script>
  // ─── Stars ───
  const canvas = document.getElementById('star-canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  const STARS = Array.from({ length: 120 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.1 + 0.2,
    base: Math.random() * 0.4 + 0.05,
    speed: Math.random() * 0.0004 + 0.0001,
    phase: Math.random() * Math.PI * 2,
  }));

  const SPARKLES = Array.from({ length: 28 }, () => ({
    x: Math.random(),
    y: Math.random(),
    r: Math.random() * 1.8 + 0.6,
    max: Math.random() * 0.28 + 0.04,
    speed: Math.random() * 0.007 + 0.002,
    phase: Math.random() * Math.PI * 2,
    color: Math.random() > 0.5 ? [251,146,60] : [96,165,250],
  }));

  let f = 0;
  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    f++;

    STARS.forEach(s => {
      const a = s.base * (0.5 + (Math.sin(f * s.speed * 60 + s.phase) * 0.5 + 0.5) * 0.5);
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(148,163,184,${a.toFixed(3)})`;
      ctx.fill();
    });

    SPARKLES.forEach(s => {
      const p = (Math.sin(f * s.speed * 60 + s.phase) + 1) / 2;
      const a = s.max * p;
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r * (0.7 + p * 0.5), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${s.color[0]},${s.color[1]},${s.color[2]},${a.toFixed(3)})`;
      ctx.fill();
    });

    requestAnimationFrame(draw);
  }
  draw();
</script>
</body>
</html>
