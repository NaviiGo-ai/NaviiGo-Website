<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0C2D4F"/>
      <stop offset="1" stop-color="#0A1426"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1400 260) rotate(90) scale(460 520)">
      <stop stop-color="#FFB15A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB15A" stop-opacity="0"/>
