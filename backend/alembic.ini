# Alembic configuration for the NaviiGo backend.
# Run from the backend/ directory:  venv/Scripts/alembic upgrade head
[alembic]
script_location = alembic
prepend_sys_path = .
# URL comes from app settings (DATABASE_URL env var) via alembic/env.py;
# this placeholder is only used to satisfy engine_from_config().
sqlalchemy.url = sqlite:///./naviigo.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
